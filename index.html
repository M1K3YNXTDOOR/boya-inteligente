<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Boya Marina Inteligente - Roatán 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #031525; color: #e2e8f0; }
    #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }

    #dashboard {
      position: absolute; top: 16px; left: 16px; width: 350px;
      background: rgba(6, 24, 40, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 14px;
      padding: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); z-index: 10;
      transition: transform 0.25s ease, max-height 0.25s ease;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
    }
    .title-wrap h1 { font-size: 1rem; color: #38bdf8; letter-spacing: 0.2px; line-height: 1.2; }
    .title-wrap p { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 6px; }

    .badge {
      padding: 4px 8px; border-radius: 20px; font-size: 0.66rem; font-weight: 700;
      text-transform: uppercase; background: #1e293b; color: #94a3b8; white-space: nowrap;
    }
    .badge.active { background: rgba(14, 165, 233, 0.25); color: #38bdf8; border: 1px solid #38bdf8; }
    .badge.danger { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid #ef4444; }
    .badge.warn { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid #f59e0b; }

    #toggle-hud {
      display: none; background: rgba(255,255,255,0.1); color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
      padding: 4px 8px; font-size: 0.75rem; cursor: pointer;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .card { background: rgba(15, 41, 66, 0.65); padding: 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
    .card .lbl { font-size: 0.68rem; color: #94a3b8; margin-bottom: 3px; }
    .card .val { font-size: 1rem; font-weight: 700; color: #f8fafc; transition: color 0.2s; }

    .bar-wrap { margin-bottom: 12px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 4px; }
    .bar-bg { width: 100%; height: 7px; background: #0f2942; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; background: #10b981; transition: width 0.2s, background 0.3s; }

    .ctrl-group { display: flex; flex-direction: column; gap: 7px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    button.ctrl-btn {
      padding: 9px 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s; color: #fff; background: #0284c7; min-height: 38px;
    }
    button.ctrl-btn:hover { background: #0369a1; }
    button.ctrl-btn.thinger { background: #059669; border: 1px solid rgba(52, 211, 153, 0.4); }
    button.ctrl-btn.thinger.connected { background: #10b981; color: #042f2e; font-weight: 700; }
    button.ctrl-btn.heat { background: #d97706; }
    button.ctrl-btn.heat:hover { background: #b45309; }
    button.ctrl-btn.turb { background: #854d0e; border: 1px solid rgba(250, 204, 21, 0.35); }
    button.ctrl-btn.turb.on { background: #ca8a04; color: #0f172a; }
    button.ctrl-btn.spill { background: #b91c1c; border: 1px solid rgba(248, 113, 113, 0.35); }
    button.ctrl-btn.spill.on { background: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,0.5); }
    button.ctrl-btn.secondary { background: #334155; }
    button.ctrl-btn.secondary:hover { background: #475569; }

    #thinger-config {
      display: none; flex-direction: column; gap: 6px;
      background: rgba(15, 41, 66, 0.85); padding: 10px; border-radius: 8px;
      border: 1px solid rgba(52, 211, 153, 0.35); margin-bottom: 2px;
    }
    #thinger-config.open { display: flex; }
    #thinger-config input {
      width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15); background: #07192b;
      color: #f8fafc; font-size: 0.78rem;
    }
    #thinger-config input::placeholder { color: #64748b; }

    #legend {
      position: absolute; bottom: 14px; right: 14px;
      background: rgba(6, 24, 40, 0.82); backdrop-filter: blur(8px);
      padding: 8px 12px; border-radius: 10px; font-size: 0.74rem;
      border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 12px; flex-wrap: wrap;
      pointer-events: none; z-index: 5;
    }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

    @media (max-width: 640px) {
      #dashboard {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        border-radius: 16px 16px 0 0; border-left: none; border-right: none; border-bottom: none;
        padding: 12px 14px 16px; max-height: 62vh; overflow-y: auto;
      }
      #dashboard.collapsed .hud-body { display: none; }
      #dashboard.collapsed .header { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
      #toggle-hud { display: inline-block; }
      .grid { gap: 6px; margin-bottom: 10px; }
      .card { padding: 7px 9px; }
      .card .val { font-size: 0.92rem; }
      #legend {
        top: 10px; bottom: auto; left: 10px; right: 10px;
        justify-content: center; gap: 8px; padding: 6px 10px; font-size: 0.68rem;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="dashboard">
    <div class="header">
      <div class="title-wrap">
        <h1>Boya Marina Inteligente</h1>
        <p id="mode-subtitle">Lectura Directa - Roatán</p>
      </div>
      <div class="header-actions">
        <span id="status-badge" class="badge">EN ESPERA</span>
        <button id="toggle-hud" aria-label="Alternar panel">Ocultar</button>
      </div>
    </div>

    <div class="hud-body">
      <div class="grid">
        <div class="card">
          <div class="lbl">Temp. Actual (DS18B20)</div>
          <div class="val" id="reef-temp">27.50 °C</div>
        </div>
        <div class="card">
          <div class="lbl">Bomba Surgencia (PWM)</div>
          <div class="val" id="pump-pwm">0%</div>
        </div>
        <div class="card">
          <div class="lbl">Turbidez (SEN0189)</div>
          <div class="val" id="turb-val">4.0 NTU</div>
        </div>
        <div class="card">
          <div class="lbl">Conductividad / TDS</div>
          <div class="val" id="tds-val">35,000 ppm</div>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar-top"><span>Salud del Arrecife Coralino</span><strong id="health-txt">100%</strong></div>
        <div class="bar-bg"><div class="bar-fill" id="health-bar"></div></div>
      </div>

      <div class="ctrl-group">
        <button class="ctrl-btn thinger" id="btn-thinger">Conectar Thinger.io (En Vivo)</button>

        <div id="thinger-config" class="open">
          <input type="text" id="th-user" placeholder="Usuario de Thinger.io" value="joseth" />
          <input type="text" id="th-device" placeholder="ID del Dispositivo" value="boya_roatan" />
          <input type="text" id="th-resource" placeholder="Recurso (ej. Temperatura)" value="Temperatura" />
          <input type="password" id="th-token" placeholder="Pega tu Access Token (eyJ...)" />
          <button class="ctrl-btn thinger" id="btn-thinger-start">Iniciar Lectura en Vivo</button>
        </div>

        <button class="ctrl-btn heat" id="btn-heat">Simular Ola de Calor (32°C)</button>
        <div class="btn-row">
          <button class="ctrl-btn turb" id="btn-turb">Simular Turbidez</button>
          <button class="ctrl-btn spill" id="btn-spill">Derrame Gas/Aceite</button>
        </div>
        <button class="ctrl-btn secondary" id="btn-reset">Reiniciar Condiciones</button>
      </div>
    </div>
  </div>

  <div id="legend">
    <span><i class="dot" style="background:#e2c285;"></i>Playa/Plataforma</span>
    <span><i class="dot" style="background:#10b981;"></i>Coral</span>
    <span><i class="dot" style="background:#38bdf8;"></i>Agua Fría 360°</span>
    <span><i class="dot" style="background:#ef4444;"></i>Agua Cálida</span>
    <span><i class="dot" style="background:#ca8a04;"></i>Turbidez</span>
    <span><i class="dot" style="background:#a855f7;"></i>Aceite/Gas</span>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const state = {
      liveThinger: false,
      heatwaveSim: false,
      reefTemp: 27.5,
      deepTemp: 18.5,
      coralHealth: 100,
      pumpPWM: 0,
      turbidityNTU: 4.0,
      tdsPpm: 35000,
      isTurbid: false,
      isOilSpill: false,
      turbLevel: 0,
      oilLevel: 0,
      heatLevel: 0
    };

    // Coordenada central de la boya directamente sobre el arrecife coralino
    const BUOY_X = -2.2;
    const BUOY_Z = 0;

    const isMobile = window.innerWidth <= 640;
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const clearBg = new THREE.Color(0x04192c);
    const warmBg = new THREE.Color(0x280d14);
    const murkyBg = new THREE.Color(0x232415);
    scene.background = clearBg.clone();
    scene.fog = new THREE.FogExp2(0x04192c, 0.013);

    const camera = new THREE.PerspectiveCamera(isMobile ? 58 : 48, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(1, isMobile ? 14 : 11.5, isMobile ? 34 : 27);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.target.set(-0.5, isMobile ? -3.5 : -2.6, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.78));
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
    sun.position.set(-18, 28, 14);
    scene.add(sun);

    const deepLight = new THREE.PointLight(0x0284c7, 2.5, 42);
    deepLight.position.set(8, -8, 4);
    scene.add(deepLight);

    // Luz térmica sutil sobre el arrecife que se tiñe de rojo cuando sube la temperatura
    const thermalLight = new THREE.PointLight(0xef4444, 0, 26);
    thermalLight.position.set(BUOY_X, 0.2, BUOY_Z);
    scene.add(thermalLight);

    function getSeabedY(x, z = 0) {
      const wave = Math.sin(x * 0.4) * Math.cos(z * 0.4) * 0.18;
      if (x < -10) return (-x - 10) * 0.48 + wave * 0.4;
      if (x < 4) return -2.4 + wave;
      const drop = Math.min(14.5, (x - 4) * 1.45);
      return -2.4 - drop + wave * 0.4;
    }

    const terrainGeo = new THREE.PlaneGeometry(56, 28, 90, 24);
    terrainGeo.rotateX(-Math.PI / 2);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      pos.setY(i, getSeabedY(x, z));
    }
    terrainGeo.computeVertexNormals();
    const seabed = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ color: 0xd8b878, roughness: 0.9, metalness: 0.04 })
    );
    scene.add(seabed);

    const clearWaterColor = new THREE.Color(0x0ea5e9);
    const warmWaterColor = new THREE.Color(0xdc2626);
    const murkyWaterColor = new THREE.Color(0x5c5329);
    const oceanMat = new THREE.MeshPhysicalMaterial({
      color: clearWaterColor.clone(), transparent: true, opacity: 0.34,
      roughness: 0.15, metalness: 0.1, side: THREE.DoubleSide
    });
    const oceanSurface = new THREE.Mesh(new THREE.PlaneGeometry(56, 28, 32, 16), oceanMat);
    oceanSurface.rotation.x = -Math.PI / 2;
    oceanSurface.position.y = 0.6;
    scene.add(oceanSurface);

    // Mancha Iridescente de Gasolina / Aceite centrada bajo la boya
    const slickGroup = new THREE.Group();
    slickGroup.position.set(BUOY_X, 0.64, BUOY_Z);
    const slickLayers = [
      { radius: 3.8, color: 0x1e1b4b, opacity: 0.62 },
      { radius: 2.8, color: 0x9333ea, opacity: 0.50 },
      { radius: 1.9, color: 0x0d9488, opacity: 0.45 },
      { radius: 1.1, color: 0xf59e0b, opacity: 0.35 }
    ];
    const slickMeshes = slickLayers.map((layer, idx) => {
      const mesh = new THREE.Mesh(
        new THREE.CircleGeometry(layer.radius, 36),
        new THREE.MeshBasicMaterial({ color: layer.color, transparent: true, opacity: 0, depthWrite: false })
      );
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = idx * 0.005;
      mesh.userData.targetOpacity = layer.opacity;
      slickGroup.add(mesh);
      return mesh;
    });
    scene.add(slickGroup);

    // Partículas de Turbidez
    const turbCount = 300;
    const turbGeo = new THREE.BufferGeometry();
    const turbPos = new Float32Array(turbCount * 3);
    for (let i = 0; i < turbCount; i++) {
      turbPos[i * 3] = -10 + Math.random() * 26;
      turbPos[i * 3 + 1] = -6.5 + Math.random() * 6.9;
      turbPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
    turbGeo.setAttribute('position', new THREE.BufferAttribute(turbPos, 3));
    const turbMat = new THREE.PointsMaterial({ color: 0x9a7b4f, size: 0.32, transparent: true, opacity: 0 });
    const turbidityCloud = new THREE.Points(turbGeo, turbMat);
    scene.add(turbidityCloud);

    // Arrecife Coralino alrededor de la boya (-8.8 a 3.4)
    const reefGroup = new THREE.Group();
    const coralMeshes = [];
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.95 });
    const palette = [0x10b981, 0xf43f5e, 0xf97316, 0xec4899, 0x14b8a6, 0xeab308];

    for (let i = 0; i < 16; i++) {
      const rx = -8.5 + Math.random() * 11.5;
      const rz = (Math.random() - 0.5) * 16;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.6, 1), rockMat);
      rock.position.set(rx, getSeabedY(rx, rz) + 0.15, rz);
      rock.scale.set(1.3, 0.55, 1.1);
      reefGroup.add(rock);
    }

    for (let i = 0; i < 44; i++) {
      const cx = -8.8 + Math.random() * 12.2;
      const cz = (Math.random() - 0.5) * 17;
      const baseY = getSeabedY(cx, cz);
      const origColor = new THREE.Color(palette[i % palette.length]);
      const mat = new THREE.MeshStandardMaterial({ color: origColor.clone(), roughness: 0.55 });
      const type = i % 3;

      if (type === 0) {
        const size = 0.42 + Math.random() * 0.45;
        const brain = new THREE.Mesh(new THREE.SphereGeometry(size, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.6), mat);
        brain.position.set(cx, baseY - 0.05, cz);
        reefGroup.add(brain);
        coralMeshes.push({ mesh: brain, origColor });
      } else if (type === 1) {
        const cluster = new THREE.Group();
        cluster.position.set(cx, baseY, cz);
        const branches = 3 + Math.floor(Math.random() * 3);
        for (let b = 0; b < branches; b++) {
          const h = 0.75 + Math.random() * 0.65;
          const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.11, h, 8), mat);
          branch.position.set((Math.random() - 0.5) * 0.35, h * 0.45, (Math.random() - 0.5) * 0.35);
          branch.rotation.set((Math.random() - 0.5) * 0.55, 0, (Math.random() - 0.5) * 0.55);
          cluster.add(branch);
          coralMeshes.push({ mesh: branch, origColor });
        }
        reefGroup.add(cluster);
      } else {
        const cluster = new THREE.Group();
        cluster.position.set(cx, baseY, cz);
        for (let t = 0; t < 3; t++) {
          const h = 0.55 + Math.random() * 0.5;
          const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.1, h, 10), mat);
          tube.position.set((t - 1) * 0.22, h * 0.45, (Math.random() - 0.5) * 0.2);
          tube.rotation.z = (t - 1) * 0.18;
          cluster.add(tube);
          coralMeshes.push({ mesh: tube, origColor });
        }
        reefGroup.add(cluster);
      }
    }
    scene.add(reefGroup);

    // Boya Marina Inteligente sobre el arrecife (-2.2, 0.6, 0)
    const buoy = new THREE.Group();
    buoy.position.set(BUOY_X, 0.6, BUOY_Z);

    const pvcMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
    const floatMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.35 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });

    const frameOffset = 1.15;
    const pipeLen = frameOffset * 2;
    const barGeoX = new THREE.CylinderGeometry(0.11, 0.11, pipeLen, 12);
    barGeoX.rotateZ(Math.PI / 2);
    const barGeoZ = new THREE.CylinderGeometry(0.11, 0.11, pipeLen, 12);
    barGeoZ.rotateX(Math.PI / 2);

    const frontBar = new THREE.Mesh(barGeoX, pvcMat); frontBar.position.set(0, 0.25, frameOffset);
    const backBar = new THREE.Mesh(barGeoX, pvcMat);  backBar.position.set(0, 0.25, -frameOffset);
    const leftBar = new THREE.Mesh(barGeoZ, pvcMat);  leftBar.position.set(-frameOffset, 0.25, 0);
    const rightBar = new THREE.Mesh(barGeoZ, pvcMat); rightBar.position.set(frameOffset, 0.25, 0);
    buoy.add(frontBar, backBar, leftBar, rightBar);

    [[-frameOffset, -frameOffset], [frameOffset, -frameOffset], [-frameOffset, frameOffset], [frameOffset, frameOffset]].forEach(([cx, cz]) => {
      const floatBall = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), floatMat);
      floatBall.position.set(cx, -0.15, cz);
      const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.28, 12), blackMat);
      strap.rotation.z = Math.PI / 2;
      strap.position.set(cx, 0.25, cz);
      buoy.add(floatBall, strap);
    });

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.7, 0.9),
      new THREE.MeshPhysicalMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.55, roughness: 0.15 })
    );
    box.position.y = 0.72;

    const pcbBoard = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.15, 0.6), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    pcbBoard.position.y = 0.65;

    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    beacon.position.set(0.15, 0.78, 0.15);

    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.5, 12), pvcMat);
    mast.position.y = 1.8;
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, 0.85, 12), blackMat);
    antenna.position.y = 2.95;

    const sensorCage = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32, 0.32, 0.95, 12, 1, true),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, wireframe: true })
    );
    sensorCage.position.y = -1.2;

    const diffuserRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.65, 0.11, 12, 24),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 })
    );
    diffuserRing.rotation.x = Math.PI / 2;
    diffuserRing.position.y = -1.15;

    buoy.add(box, pcbBoard, beacon, mast, antenna, sensorCage, diffuserRing);
    scene.add(buoy);

    // Tubería Flexible Curva desde la zona profunda, bordeando el talud del arrecife hasta la boya
    const pipeCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(12.4, -13.2, 0),
      new THREE.Vector3(9.4, -9.8, 0),
      new THREE.Vector3(6.4, -5.8, 0),
      new THREE.Vector3(3.8, -2.15, 0),
      new THREE.Vector3(0.6, -1.95, 0),
      new THREE.Vector3(BUOY_X, -1.65, 0),
      new THREE.Vector3(BUOY_X, -0.55, 0)
    ]);
    const curvedPipe = new THREE.Mesh(
      new THREE.TubeGeometry(pipeCurve, 48, 0.17, 12, false),
      new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.88, roughness: 0.4 })
    );
    scene.add(curvedPipe);

    // Partículas de Agua Fría con dispersión circular de 360°
    const pCount = 360;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pLife = new Float32Array(pCount);
    const pAngle = new Float32Array(pCount);
    const pRadiusBias = new Float32Array(pCount);

    for (let i = 0; i < pCount; i++) {
      pLife[i] = Math.random();
      pAngle[i] = Math.random() * Math.PI * 2;
      pRadiusBias[i] = 0.75 + Math.random() * 0.45;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.28, transparent: true, opacity: 0.92 });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    // Anillos de onda fría expandiéndose en círculo sobre el arrecife
    const rippleRings = [0, 0.33, 0.66].map((phase) => {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.6, 0.82, 36),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(BUOY_X, -1.75, BUOY_Z);
      ring.userData.phase = phase;
      scene.add(ring);
      return ring;
    });

    // Conexión en Vivo con Thinger.io REST API
    let thingerTimer = null;
    const btnThinger = document.getElementById('btn-thinger');
    const thingerConfig = document.getElementById('thinger-config');
    const btnThingerStart = document.getElementById('btn-thinger-start');
    const modeSub = document.getElementById('mode-subtitle');

    const thUser = document.getElementById('th-user');
    const thDevice = document.getElementById('th-device');
    const thResource = document.getElementById('th-resource');
    const thToken = document.getElementById('th-token');

    thUser.value = localStorage.getItem('th_user') || 'joseth';
    thDevice.value = localStorage.getItem('th_device') || 'boya_roatan';
    thResource.value = localStorage.getItem('th_resource') || 'Temperatura';
    thToken.value = localStorage.getItem('th_token') || '';

    function stopThinger() {
      state.liveThinger = false;
      if (thingerTimer) clearInterval(thingerTimer);
      thingerTimer = null;
      btnThinger.textContent = 'Conectar Thinger.io (En Vivo)';
      btnThinger.classList.remove('connected');
      modeSub.textContent = 'Lectura Directa - Roatán';
      modeSub.style.color = '#94a3b8';
    }

    btnThinger.addEventListener('click', () => {
      if (state.liveThinger) {
        stopThinger();
        return;
      }
      thingerConfig.classList.toggle('open');
    });

    async function fetchThingerTemp() {
      const user = thUser.value.trim();
      const device = thDevice.value.trim();
      const resource = thResource.value.trim();
      const token = thToken.value.trim();

      const baseUrl = `https://api.thinger.io/v3/users/${encodeURIComponent(user)}/devices/${encodeURIComponent(device)}/resources/${encodeURIComponent(resource)}`;

      try {
        let res = await fetch(baseUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          res = await fetch(`${baseUrl}?authorization=${encodeURIComponent(token)}`);
        }

        if (!res.ok) {
          throw new Error(`HTTP ${res.status} (${res.status === 404 ? 'Dispositivo desconectado o recurso no encontrado' : res.status === 401 ? 'Token inválido o bloqueado en Deny' : 'Error de servidor'})`);
        }

        const data = await res.json();

        let tempVal = null;
        if (typeof data === 'number') {
          tempVal = data;
        } else if (data && typeof data === 'object') {
          tempVal = data.Temperatura ?? data.temperatura ?? data.reefTemp ?? data.temp ?? data.temperature ?? data.out ?? Object.values(data).find(v => typeof v === 'number');
          if (typeof data.turbidity === 'number') state.turbidityNTU = data.turbidity;
          if (typeof data.tds === 'number') state.tdsPpm = data.tds;
        }

        if (typeof tempVal === 'number' && !isNaN(tempVal)) {
          state.reefTemp = tempVal;
        }
      } catch (err) {
        console.error('Error leyendo Thinger.io:', err);
        stopThinger();
        btnThingerStart.textContent = 'Iniciar Lectura en Vivo';
        alert(`No se pudo leer Thinger.io: ${err.message}`);
        throw err;
      }
    }

    btnThingerStart.addEventListener('click', async () => {
      if (!thUser.value.trim() || !thDevice.value.trim() || !thResource.value.trim() || !thToken.value.trim()) {
        alert('Completa todos los campos de Thinger.io primero.');
        return;
      }

      localStorage.setItem('th_user', thUser.value.trim());
      localStorage.setItem('th_device', thDevice.value.trim());
      localStorage.setItem('th_resource', thResource.value.trim());
      localStorage.setItem('th_token', thToken.value.trim());

      btnThingerStart.textContent = 'Conectando...';
      try {
        await fetchThingerTemp();
        state.liveThinger = true;
        state.heatwaveSim = false;
        thingerConfig.classList.remove('open');
        btnThinger.textContent = 'Thinger.io Conectado (Desconectar)';
        btnThinger.classList.add('connected');
        btnThingerStart.textContent = 'Iniciar Lectura en Vivo';
        modeSub.textContent = 'EN VIVO: Thinger.io (boya_roatan)';
        modeSub.style.color = '#34d399';
        thingerTimer = setInterval(() => fetchThingerTemp().catch(() => {}), 1500);
      } catch (_) {}
    });

    // Controles Manuales
    const dashboard = document.getElementById('dashboard');
    const toggleHudBtn = document.getElementById('toggle-hud');
    toggleHudBtn.addEventListener('click', () => {
      dashboard.classList.toggle('collapsed');
      toggleHudBtn.textContent = dashboard.classList.contains('collapsed') ? 'Mostrar' : 'Ocultar';
    });

    const btnTurb = document.getElementById('btn-turb');
    const btnSpill = document.getElementById('btn-spill');

    document.getElementById('btn-heat').addEventListener('click', () => {
      if (state.liveThinger) stopThinger();
      state.heatwaveSim = true;
    });
    btnTurb.addEventListener('click', () => {
      state.isTurbid = !state.isTurbid;
      state.turbidityNTU = state.isTurbid ? 68.0 : 4.0;
      btnTurb.classList.toggle('on', state.isTurbid);
    });
    btnSpill.addEventListener('click', () => {
      state.isOilSpill = !state.isOilSpill;
      state.tdsPpm = state.isOilSpill ? 11200 : 35000;
      btnSpill.classList.toggle('on', state.isOilSpill);
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      state.heatwaveSim = false;
      if (!state.liveThinger) state.reefTemp = 27.5;
      state.coralHealth = 100;
      state.isTurbid = false;
      state.isOilSpill = false;
      state.turbidityNTU = 4.0;
      state.tdsPpm = 35000;
      btnTurb.classList.remove('on');
      btnSpill.classList.remove('on');
    });

    // Bucle Principal
    const clock = new THREE.Clock();
    const bleachedWhite = new THREE.Color(0xf1f5f9);
    const tempVec = new THREE.Vector3();
    const activeWaterColor = new THREE.Color();
    const activeBgColor = new THREE.Color();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      buoy.position.y = 0.6 + Math.sin(elapsed * 2.2) * 0.11;
      buoy.rotation.z = Math.sin(elapsed * 1.7) * 0.04;

      // Factor térmico: 0 a <=28.0°C, 1 a >=31.5°C para teñir el agua ligeramente de rojo al calentarse
      const targetHeat = Math.min(1, Math.max(0, (state.reefTemp - 28.0) / 3.5));
      state.heatLevel += (targetHeat - state.heatLevel) * Math.min(1, dt * 3.0);
      state.turbLevel += ((state.isTurbid ? 1 : 0) - state.turbLevel) * Math.min(1, dt * 3.5);
      state.oilLevel += ((state.isOilSpill ? 1 : 0) - state.oilLevel) * Math.min(1, dt * 3.5);

      // Mezclar color del agua: azul -> rojizo por calor -> marrón si hay turbidez
      activeWaterColor.copy(clearWaterColor).lerp(warmWaterColor, state.heatLevel * 0.65);
      activeWaterColor.lerp(murkyWaterColor, state.turbLevel);
      oceanMat.color.copy(activeWaterColor);
      oceanMat.opacity = 0.34 + state.heatLevel * 0.12 + state.turbLevel * 0.28;

      activeBgColor.copy(clearBg).lerp(warmBg, state.heatLevel * 0.75);
      activeBgColor.lerp(murkyBg, state.turbLevel);
      scene.background.copy(activeBgColor);
      scene.fog.color.copy(activeBgColor);
      scene.fog.density = 0.013 + state.turbLevel * 0.026;
      turbMat.opacity = state.turbLevel * 0.85;
      thermalLight.intensity = state.heatLevel * 2.4;

      slickGroup.position.y = 0.64 + Math.sin(elapsed * 2.2) * 0.05;
      slickGroup.rotation.y = elapsed * 0.18;
      slickMeshes.forEach((m, idx) => {
        m.material.opacity = m.userData.targetOpacity * state.oilLevel;
        const spreadScale = (0.3 + 0.7 * state.oilLevel) * (1 + Math.sin(elapsed * 2.2 + idx) * 0.04);
        m.scale.set(spreadScale, spreadScale, 1);
      });

      if (state.isOilSpill || state.isTurbid) {
        state.pumpPWM = 0;
      } else if (state.reefTemp >= 29.0) {
        const factor = Math.min(1, (state.reefTemp - 28.8) / 2.2);
        state.pumpPWM = Math.round(55 + factor * 45);
      } else if (state.reefTemp <= 28.4) {
        state.pumpPWM = 0;
      }

      if (!state.liveThinger && state.heatwaveSim) {
        const targetTemp = 32.0;
        const q = state.pumpPWM / 100;
        const dT = 0.28 * (targetTemp - state.reefTemp) - 0.45 * q * (state.reefTemp - state.deepTemp);
        state.reefTemp += dT * dt;
      }

      const badge = document.getElementById('status-badge');
      if (state.isOilSpill && state.isTurbid) {
        badge.textContent = 'BLOQUEO: DERRAME + TURB.';
        badge.className = 'badge danger';
        beacon.material.color.setHex(0xef4444);
      } else if (state.isOilSpill) {
        badge.textContent = 'BLOQUEO: DERRAME GAS';
        badge.className = 'badge danger';
        beacon.material.color.setHex(0xa855f7);
      } else if (state.isTurbid) {
        badge.textContent = 'BLOQUEO: TURBIDEZ';
        badge.className = 'badge warn';
        beacon.material.color.setHex(0xf59e0b);
      } else if (state.pumpPWM > 0) {
        badge.textContent = 'ENFRIANDO';
        badge.className = 'badge active';
        beacon.material.color.setHex(0x38bdf8);
      } else {
        badge.textContent = 'EN ESPERA';
        badge.className = 'badge';
        beacon.material.color.setHex(0x10b981);
      }

      if (state.reefTemp > 30.0) {
        const excess = state.reefTemp - 30.0;
        state.coralHealth = Math.max(0, state.coralHealth - 4.0 * excess * excess * dt);
      } else if (state.reefTemp <= 28.5 && state.coralHealth < 100) {
        state.coralHealth = Math.min(100, state.coralHealth + 1.2 * dt);
      }

      const healthRatio = state.coralHealth / 100;
      coralMeshes.forEach(({ mesh, origColor }) => {
        mesh.material.color.copy(bleachedWhite).lerp(origColor, healthRatio);
      });

      particleSystem.visible = state.pumpPWM > 0;
      if (state.pumpPWM > 0) {
        const speed = (state.pumpPWM / 100) * 0.45;
        const arr = pGeo.attributes.position.array;
        for (let i = 0; i < pCount; i++) {
          pLife[i] = (pLife[i] + speed * dt) % 1;
          const t = pLife[i];
          if (t < 0.48) {
            const u = t / 0.48;
            pipeCurve.getPointAt(u, tempVec);
            arr[i * 3] = tempVec.x + (Math.random() - 0.5) * 0.14;
            arr[i * 3 + 1] = tempVec.y + (Math.random() - 0.5) * 0.14;
            arr[i * 3 + 2] = tempVec.z + (Math.random() - 0.5) * 0.14;
          } else {
            const u = (t - 0.48) / 0.52;
            const radius = (0.65 + u * 6.8) * pRadiusBias[i];
            const theta = pAngle[i] + u * 0.45;
            const px = BUOY_X + Math.cos(theta) * radius;
            const pz = BUOY_Z + Math.sin(theta) * radius;
            const floorY = getSeabedY(px, pz) + 0.35;
            const startY = -0.55;
            const py = startY + (floorY - startY) * Math.min(1, u * 1.35) + Math.sin(u * 9 + i) * 0.14;

            arr[i * 3] = px;
            arr[i * 3 + 1] = py;
            arr[i * 3 + 2] = pz;
          }
        }
        pGeo.attributes.position.needsUpdate = true;
      }

      rippleRings.forEach((ring) => {
        if (state.pumpPWM <= 0) {
          ring.material.opacity = 0;
          return;
        }
        const cycle = (elapsed * 0.45 + ring.userData.phase) % 1;
        const scale = 1 + cycle * 8.5;
        ring.scale.set(scale, scale, 1);
        ring.material.opacity = (1 - cycle) * 0.38 * (state.pumpPWM / 100);
      });

      const tempEl = document.getElementById('reef-temp');
      tempEl.textContent = `${state.reefTemp.toFixed(2)} °C`;
      tempEl.style.color = state.reefTemp >= 29.0 ? '#f87171' : '#f8fafc';

      document.getElementById('pump-pwm').textContent = `${state.pumpPWM}%`;
      document.getElementById('turb-val').textContent = `${state.turbidityNTU.toFixed(1)} NTU`;
      document.getElementById('tds-val').textContent = `${state.tdsPpm.toLocaleString()} ppm`;
      document.getElementById('health-txt').textContent = `${Math.round(state.coralHealth)}%`;

      const bar = document.getElementById('health-bar');
      bar.style.width = `${state.coralHealth}%`;
      bar.style.background = state.coralHealth > 60 ? '#10b981' : state.coralHealth > 30 ? '#f59e0b' : '#ef4444';

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const mobile = window.innerWidth <= 640;
      camera.fov = mobile ? 58 : 48;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
