<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Coral-Cooling Thermal Buoy 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { overflow: hidden; background: #031525; color: #e2e8f0; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }

    #dashboard {
      position: absolute; top: 18px; left: 18px; width: 320px;
      background: rgba(6, 24, 40, 0.86); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 14px;
      padding: 18px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); z-index: 10;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .header h1 { font-size: 1.05rem; color: #38bdf8; letter-spacing: 0.3px; }
    .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; background: #1e293b; color: #94a3b8; }
    .badge.active { background: rgba(14, 165, 233, 0.25); color: #38bdf8; border: 1px solid #38bdf8; }
    .badge.danger { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid #ef4444; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .card { background: rgba(15, 41, 66, 0.65); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
    .card .lbl { font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }
    .card .val { font-size: 1.1rem; font-weight: 700; color: #f8fafc; }

    .bar-wrap { margin-bottom: 14px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
    .bar-bg { width: 100%; height: 8px; background: #0f2942; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; background: #10b981; transition: width 0.2s, background 0.3s; }

    .ctrl-group { display: flex; flex-direction: column; gap: 8px; }
    .slider-row { font-size: 0.82rem; display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

    button {
      padding: 9px 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.84rem;
      cursor: pointer; transition: all 0.15s; color: #fff; background: #0284c7;
    }
    button:hover { background: #0369a1; }
    button.warn { background: #d97706; }
    button.warn:hover { background: #b45309; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }

    #legend {
      position: absolute; bottom: 16px; right: 16px;
      background: rgba(6, 24, 40, 0.78); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 10px; font-size: 0.78rem;
      border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 14px;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="dashboard">
    <div class="header">
      <h1>Coral Thermal Buoy</h1>
      <span id="status-badge" class="badge">STANDBY</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="lbl">Reef Water Temp</div>
        <div class="val" id="reef-temp">27.5 °C</div>
      </div>
      <div class="card">
        <div class="lbl">Deep Trench Temp</div>
        <div class="val" style="color:#38bdf8;">18.5 °C</div>
      </div>
      <div class="card">
        <div class="lbl">Pump Output (PWM)</div>
        <div class="val" id="pump-pwm">0%</div>
      </div>
      <div class="card">
        <div class="lbl">TDS / Turbidity</div>
        <div class="val" id="water-qual" style="font-size:0.9rem;">35k / 4 NTU</div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar-top"><span>Coral Reef Health</span><strong id="health-txt">100%</strong></div>
      <div class="bar-bg"><div class="bar-fill" id="health-bar"></div></div>
    </div>

    <div class="ctrl-group">
      <div class="slider-row">
        <div style="display:flex;justify-content:space-between;">
          <span>Ambient Ocean Temp:</span><strong id="amb-txt">27.5 °C</strong>
        </div>
        <input type="range" id="amb-slider" min="26.0" max="33.0" step="0.1" value="27.5" />
      </div>
      <button class="warn" id="btn-heat">Trigger Marine Heatwave (32°C)</button>
      <button class="danger" id="btn-spill">Trigger Oil / Turbidity Spill</button>
      <button class="secondary" id="btn-reset">Reset Simulation</button>
    </div>
  </div>

  <div id="legend">
    <span><i class="dot" style="background:#e2c285;"></i>Sandy Shore</span>
    <span><i class="dot" style="background:#10b981;"></i>Healthy Coral</span>
    <span><i class="dot" style="background:#38bdf8;"></i>Cold Upwelling Plume</span>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const state = {
      ambientTemp: 27.5,
      reefTemp: 27.5,
      deepTemp: 18.5,
      coralHealth: 100,
      pumpPWM: 0,
      isSpill: false
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04192c);
    scene.fog = new THREE.FogExp2(0x04192c, 0.013);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(2, 13, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(-1, -2, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
    sun.position.set(-18, 28, 14);
    scene.add(sun);

    const deepLight = new THREE.PointLight(0x0284c7, 2.5, 40);
    deepLight.position.set(8, -8, 4);
    scene.add(deepLight);

    // Bathymetry: Sloped Beach -> Shallow Reef Terrace -> Deep Drop-Off
    const terrainGeo = new THREE.PlaneGeometry(56, 28, 80, 20);
    terrainGeo.rotateX(-Math.PI / 2);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const wave = Math.sin(x * 0.4) * Math.cos(z * 0.4) * 0.22;
      let y = 0;
      if (x < -10) {
        y = (-x - 10) * 0.48 + wave * 0.4; // Sandy beach above water
      } else if (x < 4) {
        y = -2.4 + wave; // Shallow coral shelf
      } else {
        const drop = Math.min(16, (x - 4) * 1.45);
        y = -2.4 - drop + wave * 0.5; // Deep ocean trench
      }
      pos.setY(i, y);
    }
    terrainGeo.computeVertexNormals();
    const seabed = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({ color: 0xd8b878, roughness: 0.88, metalness: 0.05 })
    );
    scene.add(seabed);

    // Ocean Surface & Deep Water Volume
    const oceanSurface = new THREE.Mesh(
      new THREE.PlaneGeometry(56, 28, 32, 16),
      new THREE.MeshPhysicalMaterial({
        color: 0x0ea5e9, transparent: true, opacity: 0.34,
        roughness: 0.15, metalness: 0.1, side: THREE.DoubleSide
      })
    );
    oceanSurface.rotation.x = -Math.PI / 2;
    oceanSurface.position.y = 0.6;
    scene.add(oceanSurface);

    // Coral Reef Clusters along the Shallow Shelf
    const coralGroup = new THREE.Group();
    const coralMeshes = [];
    const baseColors = [0x10b981, 0x059669, 0x34d399, 0xf43f5e, 0xf97316];

    for (let i = 0; i < 36; i++) {
      const cx = -8.5 + Math.random() * 11;
      const cz = (Math.random() - 0.5) * 18;
      const size = 0.45 + Math.random() * 0.55;
      const geo = i % 2 === 0
        ? new THREE.DodecahedronGeometry(size, 1)
        : new THREE.IcosahedronGeometry(size * 0.85, 1);

      const origColor = new THREE.Color(baseColors[i % baseColors.length]);
      const mat = new THREE.MeshStandardMaterial({ color: origColor.clone(), roughness: 0.65 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(cx, -2.1 + Math.random() * 0.25, cz);
      mesh.scale.y = 0.7 + Math.random() * 0.8;
      coralGroup.add(mesh);
      coralMeshes.push({ mesh, origColor });
    }
    scene.add(coralGroup);

    // Autonomous Thermal Buoy over Trench Drop-Off (x = 6.2)
    const buoy = new THREE.Group();
    buoy.position.set(6.2, 0.6, 0);

    const hull = new THREE.Mesh(
      new THREE.CylinderGeometry(1.25, 0.95, 1.5, 20),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35 })
    );
    const mast = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, 1.8, 10),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
    );
    mast.position.y = 1.5;

    const beacon = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    beacon.position.y = 2.45;

    const intakePipe = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.24, 14.5, 16),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, transparent: true, opacity: 0.82 })
    );
    intakePipe.position.y = -7.2;

    const nozzle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.28, 1.6, 14),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
    );
    nozzle.rotation.z = Math.PI / 2;
    nozzle.position.set(-1.0, -1.3, 0);

    buoy.add(hull, mast, beacon, intakePipe, nozzle);
    scene.add(buoy);

    // Cold-Water Upwelling & Horizontal Reef Spray Particles
    const pCount = 260;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pLife = new Float32Array(pCount);
    const pSpread = new Float32Array(pCount);
    for (let i = 0; i < pCount; i++) {
      pLife[i] = Math.random();
      pSpread[i] = (Math.random() - 0.5) * 2;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.32, transparent: true, opacity: 0.88 });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    // UI Controls
    const ambSlider = document.getElementById('amb-slider');
    ambSlider.addEventListener('input', (e) => {
      state.ambientTemp = parseFloat(e.target.value);
    });
    document.getElementById('btn-heat').addEventListener('click', () => {
      state.ambientTemp = 32.0;
      ambSlider.value = 32.0;
    });
    document.getElementById('btn-spill').addEventListener('click', () => {
      state.isSpill = !state.isSpill;
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      state.ambientTemp = 27.5;
      state.reefTemp = 27.5;
      state.coralHealth = 100;
      state.isSpill = false;
      ambSlider.value = 27.5;
    });

    // Simulation Loop
    const clock = new THREE.Clock();
    const bleachedWhite = new THREE.Color(0xf1f5f9);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // Buoy gentle bobbing on waves
      buoy.position.y = 0.6 + Math.sin(elapsed * 2.2) * 0.12;
      buoy.rotation.z = Math.sin(elapsed * 1.7) * 0.04;

      // Pump & Failsafe Control Logic
      const badge = document.getElementById('status-badge');
      if (state.isSpill) {
        state.pumpPWM = 0;
        badge.textContent = 'LOCKOUT: SPILL';
        badge.className = 'badge danger';
        beacon.material.color.setHex(0xef4444);
      } else if (state.reefTemp >= 29.0) {
        const factor = Math.min(1, (state.reefTemp - 28.8) / 2.2);
        state.pumpPWM = Math.round(55 + factor * 45);
        badge.textContent = 'COOLING ACTIVE';
        badge.className = 'badge active';
        beacon.material.color.setHex(0x38bdf8);
      } else if (state.reefTemp <= 28.4) {
        state.pumpPWM = 0;
        badge.textContent = 'STANDBY';
        badge.className = 'badge';
        beacon.material.color.setHex(0x10b981);
      }

      // Thermodynamics Update
      const q = state.pumpPWM / 100;
      const dT = 0.28 * (state.ambientTemp - state.reefTemp) - 0.45 * q * (state.reefTemp - state.deepTemp);
      state.reefTemp += dT * dt;

      // Coral Bleaching & Recovery
      if (state.reefTemp > 30.0) {
        const excess = state.reefTemp - 30.0;
        state.coralHealth = Math.max(0, state.coralHealth - 4.0 * excess * excess * dt);
      } else if (state.reefTemp <= 28.5 && state.coralHealth < 100) {
        state.coralHealth = Math.min(100, state.coralHealth + 1.2 * dt);
      }

      const healthRatio = state.coralHealth / 100;
      coralMeshes.forEach(({ mesh, origColor }) => {
        mesh.material.color.copy(bleachedWhite).lerp(origColor, healthRatio);
      });

      // Animate Cold Water Particles
      particleSystem.visible = state.pumpPWM > 0;
      if (state.pumpPWM > 0) {
        const speed = (state.pumpPWM / 100) * 0.52;
        const arr = pGeo.attributes.position.array;
        for (let i = 0; i < pCount; i++) {
          pLife[i] = (pLife[i] + speed * dt) % 1;
          const t = pLife[i];
          if (t < 0.42) {
            // Upward inside deep pipe
            const u = t / 0.42;
            arr[i * 3] = 6.2 + (Math.random() - 0.5) * 0.16;
            arr[i * 3 + 1] = -13.5 + u * 12.8;
            arr[i * 3 + 2] = (Math.random() - 0.5) * 0.16;
          } else {
            // Jetting horizontally across shallow coral terrace
            const u = (t - 0.42) / 0.58;
            arr[i * 3] = 5.2 - u * 14.5;
            arr[i * 3 + 1] = -0.7 - u * 1.25 + Math.sin(u * 8 + i) * 0.18;
            arr[i * 3 + 2] = pSpread[i] * u * 7.5;
          }
        }
        pGeo.attributes.position.needsUpdate = true;
      }

      // Update Dashboard Readouts
      document.getElementById('amb-txt').textContent = `${state.ambientTemp.toFixed(1)} °C`;
      document.getElementById('reef-temp').textContent = `${state.reefTemp.toFixed(2)} °C`;
      document.getElementById('pump-pwm').textContent = `${state.pumpPWM}%`;
      document.getElementById('water-qual').textContent = state.isSpill ? '11k / 68 NTU' : '35k / 4 NTU';
      document.getElementById('health-txt').textContent = `${Math.round(state.coralHealth)}%`;

      const bar = document.getElementById('health-bar');
      bar.style.width = `${state.coralHealth}%`;
      bar.style.background = state.coralHealth > 60 ? '#10b981' : state.coralHealth > 30 ? '#f59e0b' : '#ef4444';

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
