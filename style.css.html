<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Coral-Cooling Thermal Buoy</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <h2>Thermal Buoy Telemetry</h2>
    <div class="stat"><span>Reef Temp:</span> <strong id="val-temp">27.5 °C</strong></div>
    <div class="stat"><span>Coral Health:</span> <strong id="val-health">100%</strong></div>
    <div class="stat"><span>Pump PWM:</span> <strong id="val-pump">STANDBY</strong></div>
    <div class="stat"><span>TDS / Turbidity:</span> <strong id="val-water">35k ppm / 4 NTU</strong></div>

    <div class="controls">
      <label>Ambient Temp: <span id="lbl-ambient">27.5 °C</span>
        <input type="range" id="slider-ambient" min="26" max="33" step="0.1" value="27.5" />
      </label>
      <button id="btn-heatwave">Simulate Heatwave</button>
      <button id="btn-spill" class="danger">Simulate Fuel / Turbidity Spill</button>
      <button id="btn-reset">Reset Conditions</button>
    </div>
  </div>

  <script type="module" src="scene.js"></script>
</body>
</html>
